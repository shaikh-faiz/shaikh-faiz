<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
            .bg { fill: #070B16; font-family: 'Space Grotesk', system-ui, sans-serif; }
            .orbit { fill: none; stroke: #247BFF; stroke-width: 1; stroke-opacity: 0.2; stroke-dasharray: 4 4; }
            .orbit-2 { stroke: #FF354F; }
            .title { font-size: 24px; font-weight: 700; fill: #F5F7FA; letter-spacing: 2px; }
            .tech-node { fill: #0D1220; stroke: #247BFF; stroke-width: 1; }
            .tech-text { fill: #F5F7FA; font-size: 11px; font-weight: 600; text-anchor: middle; }
        </style>
    </defs>
    
    <rect class="bg" width="800" height="400" rx="12"/>
    <text class="title" x="400" y="50" text-anchor="middle">MY DIGITAL STACK</text>
    
    <ellipse class="orbit" cx="400" cy="220" rx="280" ry="90" transform="rotate(-10 400 220)"/>
    <ellipse class="orbit orbit-2" cx="400" cy="220" rx="200" ry="65" transform="rotate(5 400 220)"/>
    <ellipse class="orbit" cx="400" cy="220" rx="120" ry="40" transform="rotate(-15 400 220)"/>

    <g transform="translate(400, 220)">
        <g transform="translate(-120, -40)"><rect class="tech-node" x="-45" y="-15" width="90" height="30" rx="15"/><text class="tech-text" y="4">GA4</text></g>
        <g transform="translate(120, 40)"><rect class="tech-node" x="-45" y="-15" width="90" height="30" rx="15"/><text class="tech-text" y="4">Semrush</text></g>
        <g transform="translate(0, -65)"><rect class="tech-node" x="-45" y="-15" width="90" height="30" rx="15"/><text class="tech-text" y="4">GSC</text></g>
        
        <g transform="translate(-200, 60)"><rect class="tech-node" x="-45" y="-15" width="90" height="30" rx="15" stroke="#FF354F"/><text class="tech-text" y="4">React/Next.js</text></g>
        <g transform="translate(200, -60)"><rect class="tech-node" x="-45" y="-15" width="90" height="30" rx="15" stroke="#FF354F"/><text class="tech-text" y="4">Google Ads</text></g>
        
        <g transform="translate(-270, -30)"><rect class="tech-node" x="-45" y="-15" width="90" height="30" rx="15"/><text class="tech-text" y="4">Ahrefs</text></g>
        <g transform="translate(260, 50)"><rect class="tech-node" x="-45" y="-15" width="90" height="30" rx="15"/><text class="tech-text" y="4">Meta Ads</text></g>
        <g transform="translate(0, 110)"><rect class="tech-node" x="-45" y="-15" width="90" height="30" rx="15"/><text class="tech-text" y="4">AI / GEO</text></g>
    </g>
</svg>
