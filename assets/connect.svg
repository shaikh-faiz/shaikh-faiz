<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
            .bg { fill: #070B16; font-family: 'Space Grotesk', system-ui, sans-serif; }
            .card { fill: #0D1220; stroke: #247BFF; stroke-width: 1; transition: all 0.3s ease; }
            .card:hover { fill: #111827; stroke: #FF354F; cursor: pointer; }
            .text-main { fill: #F5F7FA; font-weight: 700; font-size: 16px; }
            .text-sub { fill: #8B949E; font-size: 12px; }
            
            .nudge { animation: nudgeArrow 2s infinite; }
            @keyframes nudgeArrow {
                0%, 100% { transform: translateX(0); }
                50% { transform: translateX(5px); }
            }
        </style>
    </defs>
    
    <rect class="bg" width="800" height="400" rx="12"/>
    
    <!-- LEFT: Pointing Portrait -->
    <g transform="translate(-50, 40)">
        <image href="right_pointing.png" width="450" height="450" preserveAspectRatio="xMidYMax meet"/>
    </g>

    <!-- RIGHT: Social Cards -->
    <g transform="translate(420, 40)">
        <!-- LinkedIn -->
        <g transform="translate(0, 0)">
            <rect class="card" width="320" height="60" rx="8"/>
            <text class="text-main" x="20" y="25">LINKEDIN</text>
            <text class="text-sub" x="20" y="45">Professional insights &amp; digital marketing</text>
            <text class="text-main nudge" x="280" y="35" fill="#FF354F">→</text>
        </g>
        
        <!-- Instagram -->
        <g transform="translate(0, 80)">
            <rect class="card" width="320" height="60" rx="8"/>
            <text class="text-main" x="20" y="25">INSTAGRAM</text>
            <text class="text-sub" x="20" y="45">Marketing, growth &amp; personal brand</text>
            <text class="text-main nudge" x="280" y="35" fill="#FF354F">→</text>
        </g>
        
        <!-- Website -->
        <g transform="translate(0, 160)">
            <rect class="card" width="320" height="60" rx="8"/>
            <text class="text-main" x="20" y="25">WEBSITE</text>
            <text class="text-sub" x="20" y="45">SEO &amp; digital marketing services</text>
            <text class="text-main nudge" x="280" y="35" fill="#FF354F">→</text>
        </g>
        
        <!-- GitHub -->
        <g transform="translate(0, 240)">
            <rect class="card" width="320" height="60" rx="8"/>
            <text class="text-main" x="20" y="25">GITHUB</text>
            <text class="text-sub" x="20" y="45">Projects, experiments &amp; technical work</text>
            <text class="text-main nudge" x="280" y="35" fill="#FF354F">→</text>
        </g>
    </g>
</svg>
